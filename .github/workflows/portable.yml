            window.__lmBalanceBadge = true;
            var badge = null;
            var hideTimer = null;
            function ensureBadge() {
              if (badge && badge.isConnected) { return badge; }
              badge = document.createElement("div");
              badge.id = "lm-balance-badge";
              badge.style.cssText =
                "position:fixed;right:24px;bottom:96px;z-index:2147483000;" +
                "background:rgba(30,41,59,.92);color:#fff;padding:6px 12px;" +
