          // [lingomaster] lm13 lm-balance-badge: AI QA credits badge.
          // Listens to /v1/ask SSE via fetch tee; renders a fixed badge with the
          // balance from our proxy settlement headers (passed through ai_service
          // as {"type":"lm_billing"} events). Zero upstream anchors by design.
          (function () {
