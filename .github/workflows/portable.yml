# portable.yml — bk111/retain-pdf fork 的绿色便携版自动构建
# (retain_pdf_integration_plan.md R3; 以上游官方 release-desktop.yml 全步骤为底,
#  构建目标 NSIS→portable, 加上游 tag 解析/幂等跳过/LICENSE 附带/fork Release 发布)
# 安装位置: fork 仓库 .github/workflows/portable.yml

name: Build Portable (Windows)

"on":
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "wxyhgk/retain-pdf tag (留空 = 最新 release)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC 检查上游新版

permissions:
  contents: write

env:
  TYPST_VERSION: "0.14.2"
  CMARKER_VERSION: "0.1.8"
  MITEX_VERSION: "0.2.6"

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Resolve upstream tag (skip if already published)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.upstream_tag }}"
          $h = @{ "User-Agent" = "retainpdf-portable-build" }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (Invoke-RestMethod "https://api.github.com/repos/wxyhgk/retain-pdf/releases/latest" -Headers $h).tag_name
          }
          if (-not $tag.StartsWith("v")) { throw "unexpected tag: $tag" }
          $version = $tag.TrimStart("v")
          $skip = "false"
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $h
            if ($rel.assets | Where-Object { $_.name -like "RetainPDF-*-portable-win-x64.zip" }) { $skip = "true" }
          } catch {}
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT
          Write-Host "upstream tag=$tag version=$version skip=$skip"

      - name: Checkout upstream source at tag
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: wxyhgk/retain-pdf
          ref: ${{ steps.version.outputs.tag }}

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python runtime for desktop bundle
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Verify generated Python requirement snapshots
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: python backend/scripts/devtools/sync_python_requirements.py --repo-root . --check

      - name: Setup Rust toolchain
        if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust API for Windows
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path backend/rust_api/Cargo.toml

      - name: Assemble bundled Typst runtime
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $typstVersion = "${{ env.TYPST_VERSION }}"
          $typstUrl = "https://github.com/typst/typst/releases/download/v$typstVersion/typst-x86_64-pc-windows-msvc.zip"
          $downloadZip = Join-Path $env:RUNNER_TEMP "typst-windows.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "typst-windows"
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/windows/typst"
          Invoke-WebRequest -Uri $typstUrl -OutFile $downloadZip
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -Path $downloadZip -DestinationPath $extractRoot -Force
          if (Test-Path $bundleRoot) { Remove-Item $bundleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot "bin") -Force | Out-Null
          $typstExe = Get-ChildItem -Path $extractRoot -Recurse -Filter "typst.exe" | Select-Object -First 1
          if (-not $typstExe) { throw "typst.exe not found in downloaded archive" }
          Copy-Item $typstExe.FullName (Join-Path $bundleRoot "bin/typst.exe") -Force

      - name: Assemble bundled Typst packages
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/shared/typst-packages/preview"
          $packages = @(
            @{ Name = "cmarker"; Version = "${{ env.CMARKER_VERSION }}" },
            @{ Name = "mitex"; Version = "${{ env.MITEX_VERSION }}" }
          )
          if (Test-Path (Join-Path $PWD "desktop/src/runtime/shared/typst-packages")) {
            Remove-Item (Join-Path $PWD "desktop/src/runtime/shared/typst-packages") -Recurse -Force
          }
          foreach ($pkg in $packages) {
            $url = "https://packages.typst.org/preview/$($pkg.Name)-$($pkg.Version).tar.gz"
            $download = Join-Path $env:RUNNER_TEMP "$($pkg.Name)-$($pkg.Version).tar.gz"
            $extractRoot = Join-Path $env:RUNNER_TEMP "$($pkg.Name)-$($pkg.Version)"
            $targetDir = Join-Path $bundleRoot "$($pkg.Name)/$($pkg.Version)"
            Invoke-WebRequest -Uri $url -OutFile $download
            if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            tar -xzf $download -C $extractRoot
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Copy-Item (Join-Path $extractRoot "*") $targetDir -Recurse -Force
          }

      - name: Assemble bundled Python runtime
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $pythonRoot = Split-Path -Parent $pythonExe
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/windows/python"
          if (Test-Path $bundleRoot) { Remove-Item $bundleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $bundleRoot | Out-Null
          robocopy $pythonRoot $bundleRoot /E /NFL /NDL /NJH /NJS /NP /XD "__pycache__" "Doc" "docs" "Tools"
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          $sitePackages = Join-Path $bundleRoot "Lib/site-packages"
          if (Test-Path $sitePackages) { Remove-Item $sitePackages -Recurse -Force }
          New-Item -ItemType Directory -Path $sitePackages -Force | Out-Null
          python -m pip install --upgrade pip
          python -m pip install --target $sitePackages -r desktop/requirements-desktop-windows.txt
          python -m pip install --target $sitePackages -r desktop/requirements-ai-service.txt
          $pythonBundleExe = Join-Path $bundleRoot "python.exe"
          $env:PYTHONPATH = $sitePackages
          & $pythonBundleExe -c "import requests, fitz, pikepdf, PIL, urllib3; print('python_bundle_import_check=ok')"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue

      - name: Install desktop dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Install frontend dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          node -e "require('@tailwindcss/oxide')"
          if ($LASTEXITCODE -ne 0) {
            $ver = node -p "require('./node_modules/@tailwindcss/oxide/package.json').version"
            npm install --no-save --no-package-lock "@tailwindcss/oxide@$ver"
            node -e "require('@tailwindcss/oxide')"
            if ($LASTEXITCODE -ne 0) { throw "tailwindcss oxide native binding missing after reinstall" }
          }

      - name: Build Windows portable
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        shell: pwsh
        env:
          RETAIN_PDF_VERSION: ${{ steps.version.outputs.version }}
        run: npm run dist:win32

      - name: Validate desktop bundle manifest
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          Get-Content desktop/app/backend/bundle-manifest.json
          npm --prefix desktop run smoke:frontend-bundle
          python .github/scripts/validate_desktop_bundle.py --manifest desktop/app/backend/bundle-manifest.json

      - name: Package portable zip (with upstream LICENSE)
        if: steps.version.outputs.skip != 'true'
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "desktop/win/RetainPDF-Windows-$version.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem desktop/win | Select-Object Name; throw "portable exe not found: $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "portable_stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # 稳定文件名: 客户端 tool_manager 的 bin_name 是静态字段, 不能随版本变
          Copy-Item $exe (Join-Path $stage "RetainPDF-portable.exe")
          Copy-Item LICENSE (Join-Path $stage "LICENSE-RetainPDF.txt") -ErrorAction SilentlyContinue
          $zip = "RetainPDF-v$version-portable-win-x64.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "asset=$zip sha256=$sha size=$([math]::Round((Get-Item $zip).Length/1MB,1))MB"

      - name: Publish to fork release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "RetainPDF ${{ steps.version.outputs.tag }} portable (unofficial build)"
          body: "Unofficial portable build of wxyhgk/retain-pdf ${{ steps.version.outputs.tag }} (MIT). Built from upstream source by GitHub Actions; see workflow run for SHA256."
          files: RetainPDF-v${{ steps.version.outputs.version }}-portable-win-x64.zip
