# portable.yml — bk111/retain-pdf fork 的绿色便携版自动构建
# (retain_pdf_integration_plan.md R3; 以上游官方 release-desktop.yml 全步骤为底,
#  构建目标 NSIS→portable, 加上游 tag 解析/幂等跳过/LICENSE 附带/fork Release 发布)
# 安装位置: fork 仓库 .github/workflows/portable.yml
#
# lm_suffix (2026-08-01, R4 修正): 上游 v4.1.10 React cutover 后 bootstrapDesktop()
# 全码库零调用 —— 桌面模式下 desktop-config.json 的凭据/运行时配置永远进不了渲染
# 进程, 凭据门禁恒判"未配置"、作业提交缺 provider token。构建时在 React 入口恢复
# 等价引导 (见 Apply LingoMaster integration patch 步骤), 发布 tag 带 -lm 后缀
# (如 v4.1.10-lm1), 与纯上游构建区分; lm_suffix 留空 = 不打补丁的纯上游构建。
#
# lm2 (2026-08-02, R6): 产物从 portable 自解压单 exe 改为 win-unpacked 目录形态
# zip —— portable 每次启动都要解包 190MB(分钟级盲等), 目录形态秒开;
# bin_name 契约随之改 RetainPDF.exe, 必须与客户端 TOOL_REGISTRY 同版切换。

name: Build Portable (Windows)

"on":
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "wxyhgk/retain-pdf tag (留空 = 最新 release)"
        required: false
        default: ""
      lm_suffix:
        description: "集成补丁后缀 (留空 = 纯上游构建, 不打补丁)"
        required: false
        # lm1 = portable 自解压单 exe 形态(每次启动重复解包 190MB, 已弃);
        # lm2 起 = win-unpacked 目录形态 zip(启动秒开, plan R6),
        # bin_name 契约同步改为 RetainPDF.exe —— 与客户端 TOOL_REGISTRY 同版切换;
        # lm3 起 = 附带更新导流禁用补丁(自动检查关 + GITHUB_REPO 指 fork, plan R6.5);
        # lm4 起 = 目标语种 env 注入补丁(session_context 默认值改读
        # RETAIN_TARGET_LANG(_UAGE_NAME), plan R7);
        # lm5 起 = 余额门禁对非官方端点放行 + 同语种不改写 prompt 守卫;
        # lm6 起 = 移除"余额未检测"最终门禁(lm5 补的分支走不到, 见补丁4b);
        # lm7 起 = 补回 MinerU 供应商定义(上游前端只剩 paddle, 导致 GUI 上传路径
        #          把 provider 静默回落成 paddle 并被 Paddle 校验卡死, 见补丁6);
        # lm8 起 = 主进程 desktop-config.js 的硬编码白名单也放开(否则 mineru 在送到
        #          前端之前就被改写, lm7 的前端补丁形同虚设, 见补丁7)
        default: "lm8"
  # 2026-07-31 决策: 仅手动触发 (人工把关升级, 防上游坏版本自动下发);
  # 需要自动追新时再恢复 schedule cron

permissions:
  contents: write

env:
  TYPST_VERSION: "0.14.2"
  CMARKER_VERSION: "0.1.8"
  MITEX_VERSION: "0.2.6"

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Resolve upstream tag (skip if already published)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.upstream_tag }}"
          $suffix = "${{ inputs.lm_suffix }}".Trim()
          $h = @{ "User-Agent" = "retainpdf-portable-build" }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (Invoke-RestMethod "https://api.github.com/repos/wxyhgk/retain-pdf/releases/latest" -Headers $h).tag_name
          }
          if (-not $tag.StartsWith("v")) { throw "unexpected tag: $tag" }
          $version = $tag.TrimStart("v")
          $releaseTag = $tag
          $releaseVersion = $version
          if ($suffix) {
            $releaseTag = "$tag-$suffix"
            $releaseVersion = "$version-$suffix"
          }
          $skip = "false"
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/tags/$releaseTag" -Headers $h
            if ($rel.assets | Where-Object { $_.name -like "RetainPDF-*-portable-win-x64.zip" }) { $skip = "true" }
          } catch {}
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT
          Write-Host "upstream tag=$tag release_tag=$releaseTag version=$releaseVersion skip=$skip"

      - name: Checkout upstream source at tag
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: wxyhgk/retain-pdf
          ref: ${{ steps.version.outputs.tag }}

      - name: Apply LingoMaster integration patches (bootstrap + update redirect)
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.suffix != ''
        shell: pwsh
        run: |
          # 上游 bug (v4.1.10 实查): React cutover 后 bootstrapDesktop() 只有定义无调用
          # (官方桌面用户没察觉, 因为他们在设置对话框手输过一次 key, 保存路径会写
          # localStorage 影子, 后续启动组合根从影子播种; 而外部预写 desktop-config.json
          # 的集成场景影子恒空)。在 React 入口恢复等价引导:
          # loadPersistedConfig() → applyDefaultCredentialInputs() → 刷新提交门禁。
          # 锚点/标记双守卫: 上游升级导致失配时构建大声失败, 人工重审补丁。
          $path = "frontend/src/pages/home/entry.tsx"
          $src = Get-Content $path -Raw -Encoding utf8
          if ($src.Contains("[lingomaster]")) { throw "patch marker already present in $path" }
          $anchor = "services.initialize();"
          $hits = [regex]::Matches($src, [regex]::Escape($anchor)).Count
          if ($hits -ne 1) { throw "anchor '$anchor' matched $hits times in $path (expect 1); upstream changed, re-review patch" }
          $insert = @'

          // [lingomaster] 上游 React cutover 丢失桌面引导(bootstrapDesktop 全码库零调用):
          // 恢复 desktop-config.json → 渲染进程的注入,否则凭据门禁恒判"未配置"、
          // 作业提交缺 provider token。参见 fork portable.yml 的补丁步骤说明。
          import { isDesktopMode as lmIsDesktopMode, loadPersistedConfig as lmLoadPersistedConfig } from "../../js/config/desktop-persistence.js";
          import { applyDefaultCredentialInputs as lmApplyDefaultCredentialInputs } from "../../js/features/credentials/default-state-port.js";

          if (lmIsDesktopMode()) {
            void (async () => {
              try {
                const payload = await lmLoadPersistedConfig();
                lmApplyDefaultCredentialInputs((payload && payload.browserConfig) || {});
                (services.features as any)?.workflowFeature?.updateCredentialGate?.();
              } catch (error) {
                console.error("[lingomaster] desktop config bootstrap failed:", error);
              }
            })();
          }
          '@
          $patched = $src.Replace($anchor, $anchor + $insert)

          # --- 补丁2a (lm3): 关闭上游后台自动检查更新 ---
          # 更新分发走 LingoMaster 自己的 TOOL_SYNC/latest.json 管线; 若不禁,
          # 上游发新版时应用会提示更新并把用户导去下载未打补丁的官方安装版。
          $anchor2 = "const services = createHomeComposition({ appUpdateAutoCheckEnabled: true });"
          $hits2 = [regex]::Matches($patched, [regex]::Escape($anchor2)).Count
          if ($hits2 -ne 1) { throw "anchor2 '$anchor2' matched $hits2 times (expect 1); upstream changed, re-review patch" }
          $patched = $patched.Replace($anchor2, "const services = createHomeComposition({ appUpdateAutoCheckEnabled: false }); // [lingomaster] 更新由 LingoMaster 工具分发管线托管")
          Set-Content -Path $path -Value $patched -Encoding utf8 -NoNewline
          Write-Host "entry.tsx patched:"
          Select-String -Path $path -Pattern "lingomaster" | ForEach-Object { "  line $($_.LineNumber): $($_.Line.Trim())" }

          # --- 补丁2b (lm3): GITHUB_REPO 生成源改指 fork ---
          # generate-app-version.mjs 从 desktop/package.json homepage 提取 GITHUB_REPO;
          # 改指 fork 后, 设置页手动"检查更新"只对我们的 release 比对 (-lm 后缀与
          # 同核心版本比较为相等 → 恒"已是最新"), 不再导流上游安装包。
          # 顶栏 wxyhgk 项目主页链接保留 (MIT 署名礼节)。
          $pkgPath = "desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw -Encoding utf8
          $needle = '"homepage": "https://github.com/wxyhgk/retain-pdf"'
          if (-not $pkg.Contains($needle)) { throw "homepage anchor missing in desktop/package.json; upstream changed, re-review patch" }
          $pkg = $pkg.Replace($needle, '"homepage": "https://github.com/bk111/retain-pdf"')
          Set-Content -Path $pkgPath -Value $pkg -Encoding utf8 -NoNewline
          Write-Host "desktop/package.json homepage -> bk111/retain-pdf"

          # --- 补丁3 (lm4, plan R7): 目标语种由环境变量注入 ---
          # 上游把目标语言硬编码为简体中文(session_context 签名默认值, 全消费链
          # 从 control context 取值已实查)。改为 import 时读 env, 由 words13 启动器
          # 按用户选择注入 (Electron→Rust→Python 子进程链天然继承); env 缺省时
          # 行为与上游完全一致。
          $ctxPath = "backend/scripts/services/translation/services/context/session_context.py"
          $ctx = Get-Content $ctxPath -Raw -Encoding utf8
          if ($ctx.Contains("[lingomaster]")) { throw "patch marker already present in $ctxPath" }
          $anchor3a = "from __future__ import annotations"
          if ([regex]::Matches($ctx, [regex]::Escape($anchor3a)).Count -ne 1) { throw "anchor3a missing/dup in $ctxPath" }
          $insert3 = @'
          from __future__ import annotations

          # [lingomaster] R7 目标语种: 启动器经环境变量注入; 缺省=上游原行为(简体中文)。
          import os

          _LM_TARGET_LANG = os.environ.get("RETAIN_TARGET_LANG", "").strip() or "zh-CN"
          _LM_TARGET_LANGUAGE_NAME = os.environ.get("RETAIN_TARGET_LANGUAGE_NAME", "").strip() or "简体中文"
          '@
          $ctx = $ctx.Replace($anchor3a, $insert3.Trim())
          # 多行锚点必须行尾无关: runner 的 checkout 工作树是 CRLF (git autocrlf),
          # 用 [regex]::Escape(行1) + '\r?\n' + Escape(行2) 匹配
          $pattern3b = [regex]::Escape('    target_lang: str = "zh-CN",') + '\r?\n' + [regex]::Escape('    target_language_name: str = "简体中文",')
          if ([regex]::Matches($ctx, $pattern3b).Count -ne 1) { throw "anchor3b (target defaults) missing/dup in $ctxPath" }
          $ctx = [regex]::Replace($ctx, $pattern3b, "    target_lang: str = _LM_TARGET_LANG,`n    target_language_name: str = _LM_TARGET_LANGUAGE_NAME,")
          Set-Content -Path $ctxPath -Value $ctx -Encoding utf8 -NoNewline
          Write-Host "session_context.py patched (target language via env)"
          Select-String -Path $ctxPath -Pattern "RETAIN_TARGET" | ForEach-Object { "  line $($_.LineNumber): $($_.Line.Trim())" }

          # --- 补丁4 (lm5, plan R6.5b): 余额门禁对非官方端点放行 ---
          # 上游余额查询只认 api.deepseek.com(Rust deepseek_balance_url), 我们的
          # base_url 是自家代理 → 恒返回 unsupported_provider → "已检测"标志永远 false
          # → 上传对话框"直接翻译"被卡死在"无法确认 DeepSeek 余额"。额度/计费由我方
          # 服务端 credits 门禁负责, 此处不该拦。(不能伪造余额: null 会被当 0 判"不足")
          $flowPath = "frontend/src/js/features/app-actions/submit-flow.ts"
          $flow = Get-Content $flowPath -Raw -Encoding utf8
          if ($flow.Contains("[lingomaster]")) { throw "patch marker already present in $flowPath" }
          $anchor4 = '    if (result?.status === "network_error") {'
          if ([regex]::Matches($flow, [regex]::Escape($anchor4)).Count -ne 1) { throw "anchor4 missing/dup in $flowPath" }
          $insert4 = @'
              if (result?.status === "unsupported_provider") {
                // [lingomaster] 非官方 DeepSeek 端点(我方代理)没有余额接口; 额度与
                // 计费由服务端 credits 门禁负责, 此处不拦提交。
                setText("error-box", "");
                return true;
              }
          '@
          # 不再二次剥缩进: YAML 块标量已剥掉 10 空格, here-string 内容即为
          # 目标缩进(if/} 4 格、函数体 6 格), 与 submit-flow.ts 周围代码一致
          $flow = $flow.Replace($anchor4, $insert4.TrimEnd() + "`n" + $anchor4)

          # --- 补丁4b (lm6): 真正拦住提交的是"余额未检测"这道最终门禁 ---
          # lm5 只补了 unsupported_provider 分支, 但那条分支走不到: 余额查询前
          # 先做连通性校验(providers/deepseek/validate-token), 我们的代理没有该
          # 端点 → 校验就失败 → 返回的是连通性结果(status 非 unsupported_provider)
          # → 直接落到下面这道门禁 → 提交被永久卡死(2026-08-02 实测 lm5 仍复现)。
          # 余额未知不再拦截: 额度与计费由服务端 credits 门禁负责(不足返回 402)。
          # budget.blocking 保留 —— 那是真查到余额且不足才触发, 自带 key 的用户仍有效。
          $pattern4b = [regex]::Escape('  if (budget?.visible && !budget.balanceChecked) {') + '\r?\n' +
                       [regex]::Escape('    setText("error-box", "无法确认 DeepSeek 余额，请先在接口设置中完成检测。");') + '\r?\n' +
                       [regex]::Escape('    return false;') + '\r?\n' +
                       [regex]::Escape('  }')
          if ([regex]::Matches($flow, $pattern4b).Count -ne 1) { throw "anchor4b (balance-unknown gate) missing/dup in $flowPath" }
          $replace4b = '  // [lingomaster] 余额未知不拦提交: base_url 是我方代理, 上游余额接口只认' + "`n" +
                       '  // api.deepseek.com, 此处恒为"未检测"; 额度与计费由服务端 credits 门禁负责。'
          $flow = [regex]::Replace($flow, $pattern4b, $replace4b)
          Set-Content -Path $flowPath -Value $flow -Encoding utf8 -NoNewline
          Write-Host "submit-flow.ts patched (balance gate bypass + balance-unknown gate removed)"

          # --- 补丁6 (lm7, plan R11): 给前端补回 MinerU 供应商定义 ---
          # 上游 v4.1.10 前端的 OCR_PROVIDER_DEFINITIONS 里**只剩 PaddleOCR**(后端
          # Rust 仍支持 mineru)。于是 normalizeOcrProvider("mineru") 找不到 → 静默
          # 回落 paddle: ① 作业 payload 变成 {provider:"paddle", paddle_token:JWT}
          # ——我方代理只镜像 MinerU, 这条 GUI 路径提交的任务根本跑不通;
          # ② 提交前置校验拿 JWT 去验 Paddle → "Paddle Access Token 无效"卡死。
          # (2026-08-02 实测: 之前所有成功验收都是 API 直连指定 provider=mineru,
          #  GUI 上传路径一直是坏的。)
          # supportsValidation:false → 校验直接返回 skipped, 不再探我方代理没有的
          # validate-token 端点; tokenField 归位 mineru_token, 与后端契约一致。
          $provPath = "frontend/src/js/config/providers.ts"
          $prov = Get-Content $provPath -Raw -Encoding utf8
          if ($prov.Contains("LingoMaster")) { throw "patch marker already present in $provPath" }
          $anchor6a = 'export const DEFAULT_OCR_PROVIDER = "paddle";'
          if ([regex]::Matches($prov, [regex]::Escape($anchor6a)).Count -ne 1) { throw "anchor6a missing/dup in $provPath" }
          $prov = $prov.Replace($anchor6a, 'export const DEFAULT_OCR_PROVIDER = "mineru";')
          $anchor6b = 'export const OCR_PROVIDER_DEFINITIONS = ['
          if ([regex]::Matches($prov, [regex]::Escape($anchor6b)).Count -ne 1) { throw "anchor6b missing/dup in $provPath" }
          $mineru = @'
          export const OCR_PROVIDER_DEFINITIONS = [
            {
              id: "mineru",
              label: "MinerU",
              description: "MinerU 文档解析（LingoMaster 托管）。",
              tokenField: "mineru_token",
              runtimeConfigKey: "mineruToken",
              tokenLabel: "MinerU Token",
              tokenPlaceholder: "MinerU Token",
              validationButtonLabel: "检测 MinerU",
              validationIdleMessage: "未检测",
              validationMissingMessage: "请先登录 LingoMaster。",
              validationUnavailableMessage: "",
              docsUrl: "",
              docsLabel: "",
              supportsValidation: false,
            },
          '@
          $prov = $prov.Replace($anchor6b, $mineru.Trim())
          Set-Content -Path $provPath -Value $prov -Encoding utf8 -NoNewline
          Write-Host "providers.ts patched (MinerU provider restored, default -> mineru)"

          # --- 补丁7 (lm8, plan R11b): 主进程也有一份硬编码白名单 ---
          # desktop/src/main/desktop-config.js:
          #   function normalizeOcrProvider(value) {
          #     return value === "paddle" ? "paddle" : DEFAULT_OCR_PROVIDER;   // "paddle"
          #   }
          # 任何非 "paddle" 的值都被强行改写 → 我们注入的 mineru 在**送到前端之前**
          # 就没了, 所以 lm7 只补前端的 providers.ts 不起作用(实测 lm7 仍报
          # "Paddle Access Token 无效")。这里把白名单放开并把默认值改成 mineru。
          $mainCfg = "desktop/src/main/desktop-config.js"
          $mc = Get-Content $mainCfg -Raw -Encoding utf8
          if ($mc.Contains("[lingomaster]")) { throw "patch marker already present in $mainCfg" }
          $anchor7a = 'const DEFAULT_OCR_PROVIDER = "paddle";'
          if ([regex]::Matches($mc, [regex]::Escape($anchor7a)).Count -ne 1) { throw "anchor7a missing/dup in $mainCfg" }
          $mc = $mc.Replace($anchor7a, 'const DEFAULT_OCR_PROVIDER = "mineru";  // [lingomaster] main-process OCR provider whitelist')
          $anchor7b = 'return value === "paddle" ? "paddle" : DEFAULT_OCR_PROVIDER;'
          if ([regex]::Matches($mc, [regex]::Escape($anchor7b)).Count -ne 1) { throw "anchor7b missing/dup in $mainCfg" }
          $mc = $mc.Replace($anchor7b, 'return (value === "paddle" || value === "mineru") ? value : DEFAULT_OCR_PROVIDER;')
          Set-Content -Path $mainCfg -Value $mc -Encoding utf8 -NoNewline
          Write-Host "desktop-config.js patched (main-process provider whitelist accepts mineru)"

          # --- 补丁5 (lm5, plan R7b): 同语种不改写 ---
          # 目标语种==原文语种时, 上游 prompt 只说"翻译成 X", 模型无事可做便改写
          # 题干甚至直接作答(2026-08-02 实测: 英文文档译成英文, Q2 题干变成答案)。
          foreach ($p in @("backend/scripts/foundation/prompts/translation_system.txt",
                           "backend/scripts/foundation/prompts/translation_system_plain_text.txt")) {
            $t = Get-Content $p -Raw -Encoding utf8
            $head = "你是一名科研文献翻译助手。"
            if (-not $t.StartsWith($head)) { throw "prompt anchor missing in $p" }
            $guard = "若原文已经是{target_language_name}，请原样逐字输出原文，不得改写、润色、缩写或回答其中的问题。"
            if ($t.Contains($guard)) { throw "guard already present in $p" }
            Set-Content -Path $p -Value ($t.TrimEnd() + "`n" + $guard + "`n") -Encoding utf8 -NoNewline
            Write-Host "prompt guarded: $p"
          }

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python runtime for desktop bundle
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Verify generated Python requirement snapshots
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: python backend/scripts/devtools/sync_python_requirements.py --repo-root . --check

      - name: Setup Rust toolchain
        if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust API for Windows
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path backend/rust_api/Cargo.toml

      - name: Assemble bundled Typst runtime
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $typstVersion = "${{ env.TYPST_VERSION }}"
          $typstUrl = "https://github.com/typst/typst/releases/download/v$typstVersion/typst-x86_64-pc-windows-msvc.zip"
          $downloadZip = Join-Path $env:RUNNER_TEMP "typst-windows.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "typst-windows"
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/windows/typst"
          Invoke-WebRequest -Uri $typstUrl -OutFile $downloadZip
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -Path $downloadZip -DestinationPath $extractRoot -Force
          if (Test-Path $bundleRoot) { Remove-Item $bundleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot "bin") -Force | Out-Null
          $typstExe = Get-ChildItem -Path $extractRoot -Recurse -Filter "typst.exe" | Select-Object -First 1
          if (-not $typstExe) { throw "typst.exe not found in downloaded archive" }
          Copy-Item $typstExe.FullName (Join-Path $bundleRoot "bin/typst.exe") -Force

      - name: Assemble bundled Typst packages
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/shared/typst-packages/preview"
          $packages = @(
            @{ Name = "cmarker"; Version = "${{ env.CMARKER_VERSION }}" },
            @{ Name = "mitex"; Version = "${{ env.MITEX_VERSION }}" }
          )
          if (Test-Path (Join-Path $PWD "desktop/src/runtime/shared/typst-packages")) {
            Remove-Item (Join-Path $PWD "desktop/src/runtime/shared/typst-packages") -Recurse -Force
          }
          foreach ($pkg in $packages) {
            $url = "https://packages.typst.org/preview/$($pkg.Name)-$($pkg.Version).tar.gz"
            $download = Join-Path $env:RUNNER_TEMP "$($pkg.Name)-$($pkg.Version).tar.gz"
            $extractRoot = Join-Path $env:RUNNER_TEMP "$($pkg.Name)-$($pkg.Version)"
            $targetDir = Join-Path $bundleRoot "$($pkg.Name)/$($pkg.Version)"
            Invoke-WebRequest -Uri $url -OutFile $download
            if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            tar -xzf $download -C $extractRoot
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Copy-Item (Join-Path $extractRoot "*") $targetDir -Recurse -Force
          }

      - name: Assemble bundled Python runtime
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $pythonRoot = Split-Path -Parent $pythonExe
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/windows/python"
          if (Test-Path $bundleRoot) { Remove-Item $bundleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $bundleRoot | Out-Null
          robocopy $pythonRoot $bundleRoot /E /NFL /NDL /NJH /NJS /NP /XD "__pycache__" "Doc" "docs" "Tools"
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          $sitePackages = Join-Path $bundleRoot "Lib/site-packages"
          if (Test-Path $sitePackages) { Remove-Item $sitePackages -Recurse -Force }
          New-Item -ItemType Directory -Path $sitePackages -Force | Out-Null
          python -m pip install --upgrade pip
          python -m pip install --target $sitePackages -r desktop/requirements-desktop-windows.txt
          python -m pip install --target $sitePackages -r desktop/requirements-ai-service.txt
          $pythonBundleExe = Join-Path $bundleRoot "python.exe"
          $env:PYTHONPATH = $sitePackages
          & $pythonBundleExe -c "import requests, fitz, pikepdf, PIL, urllib3; print('python_bundle_import_check=ok')"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue

      - name: Install desktop dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Install frontend dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          node -e "require('@tailwindcss/oxide')"
          if ($LASTEXITCODE -ne 0) {
            $ver = node -p "require('./node_modules/@tailwindcss/oxide/package.json').version"
            npm install --no-save --no-package-lock "@tailwindcss/oxide@$ver"
            node -e "require('@tailwindcss/oxide')"
            if ($LASTEXITCODE -ne 0) { throw "tailwindcss oxide native binding missing after reinstall" }
          }

      - name: Build Windows app directory (win-unpacked)
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        shell: pwsh
        env:
          RETAIN_PDF_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # R6 (2026-08-02): 弃 portable 自解压单 exe (上游 dist:win32), 改出目录形态 —
          # portable 每次启动都要向临时目录解包 190MB (分钟级盲等), 目录形态启动秒开。
          # prepare-app 与上游 dist:win32 前半段一致; --win dir 覆盖 package.json 的 portable target。
          npm run prepare-app
          if ($LASTEXITCODE -ne 0) { throw "prepare-app failed" }
          npx electron-builder --win dir --x64 --config.directories.output=win
          if ($LASTEXITCODE -ne 0) { throw "electron-builder --win dir failed" }

      - name: Validate desktop bundle manifest
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          Get-Content desktop/app/backend/bundle-manifest.json
          npm --prefix desktop run smoke:frontend-bundle
          python .github/scripts/validate_desktop_bundle.py --manifest desktop/app/backend/bundle-manifest.json

      - name: Verify patch survived into built bundle
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.suffix != ''
        shell: pwsh
        run: |
          # esbuild minify 会剥注释/重命名标识符, 用补丁里的 console.error 字符串字面量作探针;
          # 全树搜产物 (frontend/dist 与 desktop/app 各有一份), 每份都必须含探针
          $bundles = Get-ChildItem -Path . -Filter "app.bundle.js" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $bundles) { throw "no app.bundle.js found for patch verification" }
          foreach ($b in $bundles) {
            $text = Get-Content $b.FullName -Raw
            if (-not $text.Contains("[lingomaster] desktop config bootstrap failed")) {
              throw "bootstrap patch probe missing in built bundle: $($b.FullName)"
            }
            if (-not $text.Contains("bk111/retain-pdf")) {
              throw "update-redirect probe (GITHUB_REPO=bk111/retain-pdf) missing in: $($b.FullName)"
            }
            # 反向探针(补丁4b): 那句拦死提交的红字必须从产物里彻底消失
            if ($text.Contains("无法确认 DeepSeek 余额")) {
              throw "balance-unknown gate still present in: $($b.FullName)"
            }
            # 补丁6: MinerU 供应商定义必须在册(否则 provider 又被回落成 paddle)
            if (-not $text.Contains("LingoMaster")) {
              throw "MinerU provider definition missing in: $($b.FullName)"
            }
            Write-Host "frontend patch probes OK (bootstrap + update-redirect + balance gate removed) in $($b.FullName)"
          }
          # 补丁3 探针: 打包进 app 的后端 python 必含目标语种 env 读取
          $ctxCopies = Get-ChildItem -Path . -Filter "session_context.py" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $ctxCopies) { throw "no session_context.py found for patch verification" }
          foreach ($c in $ctxCopies) {
            if (-not (Get-Content $c.FullName -Raw).Contains("RETAIN_TARGET_LANGUAGE_NAME")) {
              throw "target-language patch probe missing in: $($c.FullName)"
            }
            Write-Host "target-language probe found in $($c.FullName)"
          }
          # 补丁7 探针: 主进程的 provider 白名单(asar 内主进程代码不压缩, 标记可直查)
          $mains = Get-ChildItem -Path . -Filter "desktop-config.js" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $mains) { throw "no desktop-config.js found for patch verification" }
          foreach ($m in $mains) {
            $mt = Get-Content $m.FullName -Raw
            if (-not $mt.Contains("[lingomaster] main-process OCR provider whitelist")) {
              throw "main-process provider whitelist patch missing in: $($m.FullName)"
            }
            if (-not $mt.Contains('value === "mineru"')) {
              throw "main-process whitelist does not accept mineru in: $($m.FullName)"
            }
            Write-Host "main-process provider probe OK in $($m.FullName)"
          }
          # 补丁5 探针: 装船的 prompt 必含同语种守卫
          $prompts = Get-ChildItem -Path . -Filter "translation_system.txt" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $prompts) { throw "no translation_system.txt found for patch verification" }
          foreach ($p in $prompts) {
            if (-not (Get-Content $p.FullName -Raw).Contains("请原样逐字输出原文")) {
              throw "same-language guard missing in: $($p.FullName)"
            }
            Write-Host "same-language guard found in $($p.FullName)"
          }

      - name: Package app-directory zip (with upstream LICENSE)
        if: steps.version.outputs.skip != 'true'
        id: package
        shell: pwsh
        run: |
          $releaseVersion = "${{ steps.version.outputs.release_version }}"
          $unpacked = "desktop/win/win-unpacked"
          # 稳定入口名: 客户端 tool_manager 的 bin_name 是静态契约 (lm2 起 = RetainPDF.exe)
          if (-not (Test-Path "$unpacked/RetainPDF.exe")) { Get-ChildItem desktop/win | Select-Object Name; throw "RetainPDF.exe not found in $unpacked" }
          Copy-Item LICENSE (Join-Path $unpacked "LICENSE-RetainPDF.txt") -ErrorAction SilentlyContinue
          # 长路径预算: 客户端解压到 <app>\bin\retain-pdf\, 用户机未必开 LongPathsEnabled;
          # zip 内相对路径超 180 字符即失败, 留 ~80 字符给安装前缀
          $rootLen = (Resolve-Path $unpacked).Path.Length + 1
          $paths = Get-ChildItem $unpacked -Recurse -File | ForEach-Object { $_.FullName.Substring($rootLen) }
          $longest = $paths | Sort-Object Length -Descending | Select-Object -First 5
          Write-Host "longest relative paths:"
          $longest | ForEach-Object { Write-Host ("  {0} chars: {1}" -f $_.Length, $_) }
          if (($longest | Select-Object -First 1).Length -gt 180) { throw "zip relative path exceeds 180 chars budget" }
          $zip = "RetainPDF-v$releaseVersion-portable-win-x64.zip"
          Compress-Archive -Path "$unpacked/*" -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "asset=$zip sha256=$sha size=$([math]::Round((Get-Item $zip).Length/1MB,1))MB"

      - name: Publish to fork release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: "RetainPDF ${{ steps.version.outputs.release_tag }} portable (unofficial build)"
          body: "Unofficial portable build of wxyhgk/retain-pdf ${{ steps.version.outputs.tag }} (MIT). lm_suffix=${{ steps.version.outputs.suffix }} (non-empty = LingoMaster desktop-bootstrap patch applied to frontend entry; see portable.yml patch step). Built from upstream source by GitHub Actions; see workflow run for SHA256."
          files: RetainPDF-v${{ steps.version.outputs.release_version }}-portable-win-x64.zip
