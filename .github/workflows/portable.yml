                "pointer-events:none;display:none;";
              (document.body || document.documentElement).appendChild(badge);
              return badge;
            }
            function show(charged, balance) {
              var el = ensureBadge();
              var hasBalance = balance !== null && balance !== undefined && balance !== "";
              var hasCharge = charged !== null && charged !== undefined && charged !== "" && Number(charged) > 0;
              var parts = [];
              if (hasBalance) { parts.push("余额 " + balance); }
              if (hasCharge) { parts.push("本轮 -" + charged); }
              if (!parts.length) { return; }
              el.textContent = parts.join(" · ");
              el.style.display = "block";
              if (hideTimer) { clearTimeout(hideTimer); }
              hideTimer = setTimeout(function () {
                if (hasBalance) { el.textContent = "余额 " + balance; }
              }, 6000);
            }
            var origFetch = window.fetch;
            if (!origFetch) { return; }
            window.fetch = function (input) {
              var url = "";
              try { url = typeof input === "string" ? input : ((input && input.url) || ""); } catch (e) { url = ""; }
              var pending = origFetch.apply(this, arguments);
              if (url.indexOf("/v1/ask") === -1) { return pending; }
              return pending.then(function (resp) {
                try {
                  if (!resp || !resp.body || typeof resp.body.tee !== "function") { return resp; }
                  var pair = resp.body.tee();
                  var reader = pair[1].getReader();
                  var decoder = new TextDecoder("utf-8");
                  var buffer = "";
