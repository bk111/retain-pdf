# portable.yml — bk111/retain-pdf fork 的绿色便携版自动构建
# (retain_pdf_integration_plan.md R3; 以上游官方 release-desktop.yml 全步骤为底,
#  构建目标 NSIS→portable, 加上游 tag 解析/幂等跳过/LICENSE 附带/fork Release 发布)
# 安装位置: fork 仓库 .github/workflows/portable.yml
#
# lm_suffix (2026-08-01, R4 修正): 上游 v4.1.10 React cutover 后 bootstrapDesktop()
# 全码库零调用 —— 桌面模式下 desktop-config.json 的凭据/运行时配置永远进不了渲染
# 进程, 凭据门禁恒判"未配置"、作业提交缺 provider token。构建时在 React 入口恢复
# 等价引导 (见 Apply LingoMaster integration patch 步骤), 发布 tag 带 -lm 后缀
# (如 v4.1.10-lm1), 与纯上游构建区分; lm_suffix 留空 = 不打补丁的纯上游构建。
#
# lm2 (2026-08-02, R6): 产物从 portable 自解压单 exe 改为 win-unpacked 目录形态
# zip —— portable 每次启动都要解包 190MB(分钟级盲等), 目录形态秒开;
# bin_name 契约随之改 RetainPDF.exe, 必须与客户端 TOOL_REGISTRY 同版切换。

name: Build Portable (Windows)

"on":
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "wxyhgk/retain-pdf tag (留空 = 最新 release)"
        required: false
        default: ""
      lm_suffix:
        description: "集成补丁后缀 (留空 = 纯上游构建, 不打补丁)"
        required: false
        # lm1 = portable 自解压单 exe 形态(每次启动重复解包 190MB, 已弃);
        # lm2 起 = win-unpacked 目录形态 zip(启动秒开, plan R6),
        # bin_name 契约同步改为 RetainPDF.exe —— 与客户端 TOOL_REGISTRY 同版切换;
        # lm3 起 = 附带更新导流禁用补丁(自动检查关 + GITHUB_REPO 指 fork, plan R6.5);
        # lm4 起 = 目标语种 env 注入补丁(session_context 默认值改读
        # RETAIN_TARGET_LANG(_UAGE_NAME), plan R7);
        # lm5 起 = 余额门禁对非官方端点放行 + 同语种不改写 prompt 守卫;
        # lm6 起 = 移除"余额未检测"最终门禁(lm5 补的分支走不到, 见补丁4b);
        # lm7 起 = 补回 MinerU 供应商定义(上游前端只剩 paddle, 导致 GUI 上传路径
        #          把 provider 静默回落成 paddle 并被 Paddle 校验卡死, 见补丁6);
        # lm8 起 = 主进程 desktop-config.js 的硬编码白名单也放开(否则 mineru 在送到
        #          前端之前就被改写, lm7 的前端补丁形同虚设, 见补丁7);
        # lm9 起 = 目标语种选择器进 设置→任务选项(plan R12, 见补丁8) + 补丁3 改为
        #          调用时解析 desktop-config(保存后下一单即生效) + 源=目标语种在
        #          翻译前拦截(见补丁9);
        # lm10 起 = 译后文件名前缀跟随目标语种(上游硬编码 zh_, 见补丁10);
        # lm11 起 = 阿拉伯/泰语字体入包 + Typst 显式字体链(否则落系统 Tahoma/
        #           Times, 风格不搭且各机不一, 见补丁11) + 翻译缓存拒收 echo
        #           条目(同语种守卫的逐字回写曾毒化缓存, 见补丁12);
        # lm12 起 = DEFAULT_BASE_URL 常量改指我方代理(上游默认 DeepSeek 官方,
        #           任何回退链走到它就把用户 JWT 发给第三方且译文全空, 见补丁13)
        #           + 终局回收全军覆没时响亮失败(不许静默渲染原文, 见补丁14);
        # lm13 起 = AI 问答余额角标(代理结算头经 ai_service 透传为 lm_billing
        #           SSE 事件, 前端 fetch-tee 监听, 见补丁15) + backend 剔除
        #           devtools/tests 不装船(见补丁16) + 带 doc 过滤检索 0 行时
        #           rust 现场回填 FTS(免重启自愈, 见补丁17)
        default: "lm13"
  # 2026-07-31 决策: 仅手动触发 (人工把关升级, 防上游坏版本自动下发);
  # 需要自动追新时再恢复 schedule cron

permissions:
  contents: write

env:
  TYPST_VERSION: "0.14.2"
  CMARKER_VERSION: "0.1.8"
  MITEX_VERSION: "0.2.6"

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Resolve upstream tag (skip if already published)
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.upstream_tag }}"
          $suffix = "${{ inputs.lm_suffix }}".Trim()
          $h = @{ "User-Agent" = "retainpdf-portable-build" }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (Invoke-RestMethod "https://api.github.com/repos/wxyhgk/retain-pdf/releases/latest" -Headers $h).tag_name
          }
          if (-not $tag.StartsWith("v")) { throw "unexpected tag: $tag" }
          $version = $tag.TrimStart("v")
          $releaseTag = $tag
          $releaseVersion = $version
          if ($suffix) {
            $releaseTag = "$tag-$suffix"
            $releaseVersion = "$version-$suffix"
          }
          $skip = "false"
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/tags/$releaseTag" -Headers $h
            if ($rel.assets | Where-Object { $_.name -like "RetainPDF-*-portable-win-x64.zip" }) { $skip = "true" }
          } catch {}
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT
          Write-Host "upstream tag=$tag release_tag=$releaseTag version=$releaseVersion skip=$skip"

      - name: Checkout upstream source at tag
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: wxyhgk/retain-pdf
          ref: ${{ steps.version.outputs.tag }}

      - name: Apply LingoMaster integration patches (bootstrap + update redirect)
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.suffix != ''
        shell: pwsh
        run: |
          # 引擎断言: 本步 8 处 Set-Content -Encoding utf8 改源文件, 而该参数在 5.1 下
          # 写 BOM、在 pwsh 7 下不写。CI 恒为 pwsh, 但本地复现误用 5.1 会把 BOM 塞进源码;
          # YAML 的 run: 块吃不到 #requires -Version, 只能显式断言。
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "this step requires pwsh 7 (found $($PSVersionTable.PSVersion)): 5.1's -Encoding utf8 writes a BOM and would corrupt the patched sources" }
          # 上游 bug (v4.1.10 实查): React cutover 后 bootstrapDesktop() 只有定义无调用
          # (官方桌面用户没察觉, 因为他们在设置对话框手输过一次 key, 保存路径会写
          # localStorage 影子, 后续启动组合根从影子播种; 而外部预写 desktop-config.json
          # 的集成场景影子恒空)。在 React 入口恢复等价引导:
          # loadPersistedConfig() → applyDefaultCredentialInputs() → 刷新提交门禁。
          # 锚点/标记双守卫: 上游升级导致失配时构建大声失败, 人工重审补丁。
          $path = "frontend/src/pages/home/entry.tsx"
          $src = Get-Content $path -Raw -Encoding utf8
          if ($src.Contains("[lingomaster]")) { throw "patch marker already present in $path" }
          $anchor = "services.initialize();"
          $hits = [regex]::Matches($src, [regex]::Escape($anchor)).Count
          if ($hits -ne 1) { throw "anchor '$anchor' matched $hits times in $path (expect 1); upstream changed, re-review patch" }
          $insert = @'

          // [lingomaster] 上游 React cutover 丢失桌面引导(bootstrapDesktop 全码库零调用):
          // 恢复 desktop-config.json → 渲染进程的注入,否则凭据门禁恒判"未配置"、
          // 作业提交缺 provider token。参见 fork portable.yml 的补丁步骤说明。
          import { isDesktopMode as lmIsDesktopMode, loadPersistedConfig as lmLoadPersistedConfig } from "../../js/config/desktop-persistence.js";
          import { applyDefaultCredentialInputs as lmApplyDefaultCredentialInputs } from "../../js/features/credentials/default-state-port.js";
          import "../../js/config/lm-balance-badge.js"; // [lingomaster] lm13: AI 问答余额角标(fetch-tee 监听 lm_billing 事件)

          if (lmIsDesktopMode()) {
            void (async () => {
              try {
                const payload = await lmLoadPersistedConfig();
                lmApplyDefaultCredentialInputs((payload && payload.browserConfig) || {});
                (services.features as any)?.workflowFeature?.updateCredentialGate?.();
              } catch (error) {
                console.error("[lingomaster] desktop config bootstrap failed:", error);
              }
            })();
          }
          '@
          $patched = $src.Replace($anchor, $anchor + $insert)

          # --- 补丁2a (lm3): 关闭上游后台自动检查更新 ---
          # 更新分发走 LingoMaster 自己的 TOOL_SYNC/latest.json 管线; 若不禁,
          # 上游发新版时应用会提示更新并把用户导去下载未打补丁的官方安装版。
          $anchor2 = "const services = createHomeComposition({ appUpdateAutoCheckEnabled: true });"
          $hits2 = [regex]::Matches($patched, [regex]::Escape($anchor2)).Count
          if ($hits2 -ne 1) { throw "anchor2 '$anchor2' matched $hits2 times (expect 1); upstream changed, re-review patch" }
          $patched = $patched.Replace($anchor2, "const services = createHomeComposition({ appUpdateAutoCheckEnabled: false }); // [lingomaster] 更新由 LingoMaster 工具分发管线托管")
          Set-Content -Path $path -Value $patched -Encoding utf8 -NoNewline
          Write-Host "entry.tsx patched:"
          Select-String -Path $path -Pattern "lingomaster" | ForEach-Object { "  line $($_.LineNumber): $($_.Line.Trim())" }

          # --- 补丁2b (lm3): GITHUB_REPO 生成源改指 fork ---
          # generate-app-version.mjs 从 desktop/package.json homepage 提取 GITHUB_REPO;
          # 改指 fork 后, 设置页手动"检查更新"只对我们的 release 比对 (-lm 后缀与
          # 同核心版本比较为相等 → 恒"已是最新"), 不再导流上游安装包。
          # 顶栏 wxyhgk 项目主页链接保留 (MIT 署名礼节)。
          $pkgPath = "desktop/package.json"
          $pkg = Get-Content $pkgPath -Raw -Encoding utf8
          $needle = '"homepage": "https://github.com/wxyhgk/retain-pdf"'
          if (-not $pkg.Contains($needle)) { throw "homepage anchor missing in desktop/package.json; upstream changed, re-review patch" }
          $pkg = $pkg.Replace($needle, '"homepage": "https://github.com/bk111/retain-pdf"')
          Set-Content -Path $pkgPath -Value $pkg -Encoding utf8 -NoNewline
          Write-Host "desktop/package.json homepage -> bk111/retain-pdf"

          # --- 补丁3 (lm4 立项, lm9 改版, plan R7/R12): 目标语种调用时解析 ---
          # lm4 版是 import 时读 env(每次启动定值)。lm9 起改为**调用时**解析:
          # RetainPDF 设置→任务选项 保存的 developerConfig.targetLanguage(Name)
          # 落盘 desktop-config.json, 而每个翻译任务都是新起的 Python 进程
          # (job_runner/worker_process.rs 每次 Command::new) —— 因此读盘放在调用点
          # 就能做到"保存后下一单即生效、无需重启", 不动 Rust 与 stage spec。
          # 优先级: desktop-config > 环境变量(words13 启动器注入的首次默认) >
          # 上游原行为(简体中文)。显式传参的调用方(测试等)不受影响。
          $ctxPath = "backend/scripts/services/translation/services/context/session_context.py"
          $ctx = Get-Content $ctxPath -Raw -Encoding utf8
          if ($ctx.Contains("[lingomaster]")) { throw "patch marker already present in $ctxPath" }
          $anchor3a = "from __future__ import annotations"
          if ([regex]::Matches($ctx, [regex]::Escape($anchor3a)).Count -ne 1) { throw "anchor3a missing/dup in $ctxPath" }
          $insert3 = @'
          from __future__ import annotations

          # [lingomaster] R7/R12 目标语种: 调用时解析(不能放模块常量/默认参数 ——
          # Python 默认参数在 def 时求值, 做不到"改了下一单生效")。
          # 优先 desktop-config.json 的 developerConfig(RetainPDF 设置→任务选项),
          # 其次环境变量(words13 启动器注入), 最后回退上游原行为(简体中文)。
          import json as _lm_json
          import os as _lm_os


          def _lm_resolve_target_language() -> tuple[str, str]:
              lang = ""
              name = ""
              try:
                  appdata = _lm_os.environ.get("APPDATA", "")
                  if appdata:
                      for _dir in ("retain-pdf-desktop", "RetainPDF"):
                          cfg_path = _lm_os.path.join(appdata, _dir, "desktop-config.json")
                          if not _lm_os.path.isfile(cfg_path):
                              continue
                          with open(cfg_path, "r", encoding="utf-8-sig") as fh:
                              dev = (_lm_json.load(fh) or {}).get("developerConfig") or {}
                          lang = str(dev.get("targetLanguage") or "").strip()
                          name = str(dev.get("targetLanguageName") or "").strip()
                          break
              except Exception:
                  lang = ""
                  name = ""
              lang = lang or _lm_os.environ.get("RETAIN_TARGET_LANG", "").strip() or "zh-CN"
              name = name or _lm_os.environ.get("RETAIN_TARGET_LANGUAGE_NAME", "").strip() or "简体中文"
              return lang, name
          '@
          $ctx = $ctx.Replace($anchor3a, $insert3.Trim())
          # 多行锚点必须行尾无关: runner 的 checkout 工作树是 CRLF (git autocrlf),
          # 用 [regex]::Escape(行1) + '\r?\n' + Escape(行2) 匹配
          $pattern3b = [regex]::Escape('    target_lang: str = "zh-CN",') + '\r?\n' + [regex]::Escape('    target_language_name: str = "简体中文",')
          if ([regex]::Matches($ctx, $pattern3b).Count -ne 1) { throw "anchor3b (target defaults) missing/dup in $ctxPath" }
          $ctx = [regex]::Replace($ctx, $pattern3b, '    target_lang: str = "",' + "`n" + '    target_language_name: str = "",')
          # 3c: 函数体内解析(哨兵空串=走默认)。锚在唯一的 control_context 调用行前。
          $anchor3c = "    return build_translation_control_context("
          if ([regex]::Matches($ctx, [regex]::Escape($anchor3c)).Count -ne 1) { throw "anchor3c missing/dup in $ctxPath" }
          $insert3c = @'
              # [lingomaster] 显式传参优先; 走默认(哨兵空串)时才解析 config/env。
              if not str(target_lang or "").strip() or not str(target_language_name or "").strip():
                  _lm_lang, _lm_name = _lm_resolve_target_language()
                  target_lang = str(target_lang or "").strip() or _lm_lang
                  target_language_name = str(target_language_name or "").strip() or _lm_name
          '@
          $ctx = $ctx.Replace($anchor3c, $insert3c.TrimEnd() + "`n" + $anchor3c)
          Set-Content -Path $ctxPath -Value $ctx -Encoding utf8 -NoNewline
          Write-Host "session_context.py patched (call-time target language resolution)"
          Select-String -Path $ctxPath -Pattern "RETAIN_TARGET|targetLanguage" | ForEach-Object { "  line $($_.LineNumber): $($_.Line.Trim())" }

          # --- 补丁4 (lm5, plan R6.5b): 余额门禁对非官方端点放行 ---
          # 上游余额查询只认 api.deepseek.com(Rust deepseek_balance_url), 我们的
          # base_url 是自家代理 → 恒返回 unsupported_provider → "已检测"标志永远 false
          # → 上传对话框"直接翻译"被卡死在"无法确认 DeepSeek 余额"。额度/计费由我方
          # 服务端 credits 门禁负责, 此处不该拦。(不能伪造余额: null 会被当 0 判"不足")
          $flowPath = "frontend/src/js/features/app-actions/submit-flow.ts"
          $flow = Get-Content $flowPath -Raw -Encoding utf8
          if ($flow.Contains("[lingomaster]")) { throw "patch marker already present in $flowPath" }
          $anchor4 = '    if (result?.status === "network_error") {'
          if ([regex]::Matches($flow, [regex]::Escape($anchor4)).Count -ne 1) { throw "anchor4 missing/dup in $flowPath" }
          $insert4 = @'
              if (result?.status === "unsupported_provider") {
                // [lingomaster] 非官方 DeepSeek 端点(我方代理)没有余额接口; 额度与
                // 计费由服务端 credits 门禁负责, 此处不拦提交。
                setText("error-box", "");
                return true;
              }
          '@
          # 不再二次剥缩进: YAML 块标量已剥掉 10 空格, here-string 内容即为
          # 目标缩进(if/} 4 格、函数体 6 格), 与 submit-flow.ts 周围代码一致
          $flow = $flow.Replace($anchor4, $insert4.TrimEnd() + "`n" + $anchor4)

          # --- 补丁4b (lm6): 真正拦住提交的是"余额未检测"这道最终门禁 ---
          # lm5 只补了 unsupported_provider 分支, 但那条分支走不到: 余额查询前
          # 先做连通性校验(providers/deepseek/validate-token), 我们的代理没有该
          # 端点 → 校验就失败 → 返回的是连通性结果(status 非 unsupported_provider)
          # → 直接落到下面这道门禁 → 提交被永久卡死(2026-08-02 实测 lm5 仍复现)。
          # 余额未知不再拦截: 额度与计费由服务端 credits 门禁负责(不足返回 402)。
          # budget.blocking 保留 —— 那是真查到余额且不足才触发, 自带 key 的用户仍有效。
          $pattern4b = [regex]::Escape('  if (budget?.visible && !budget.balanceChecked) {') + '\r?\n' +
                       [regex]::Escape('    setText("error-box", "无法确认 DeepSeek 余额，请先在接口设置中完成检测。");') + '\r?\n' +
                       [regex]::Escape('    return false;') + '\r?\n' +
                       [regex]::Escape('  }')
          if ([regex]::Matches($flow, $pattern4b).Count -ne 1) { throw "anchor4b (balance-unknown gate) missing/dup in $flowPath" }
          $replace4b = '  // [lingomaster] 余额未知不拦提交: base_url 是我方代理, 上游余额接口只认' + "`n" +
                       '  // api.deepseek.com, 此处恒为"未检测"; 额度与计费由服务端 credits 门禁负责。'
          $flow = [regex]::Replace($flow, $pattern4b, $replace4b)
          Set-Content -Path $flowPath -Value $flow -Encoding utf8 -NoNewline
          Write-Host "submit-flow.ts patched (balance gate bypass + balance-unknown gate removed)"

          # --- 补丁6 (lm7, plan R11): 给前端补回 MinerU 供应商定义 ---
          # 上游 v4.1.10 前端的 OCR_PROVIDER_DEFINITIONS 里**只剩 PaddleOCR**(后端
          # Rust 仍支持 mineru)。于是 normalizeOcrProvider("mineru") 找不到 → 静默
          # 回落 paddle: ① 作业 payload 变成 {provider:"paddle", paddle_token:JWT}
          # ——我方代理只镜像 MinerU, 这条 GUI 路径提交的任务根本跑不通;
          # ② 提交前置校验拿 JWT 去验 Paddle → "Paddle Access Token 无效"卡死。
          # (2026-08-02 实测: 之前所有成功验收都是 API 直连指定 provider=mineru,
          #  GUI 上传路径一直是坏的。)
          # supportsValidation:false → 校验直接返回 skipped, 不再探我方代理没有的
          # validate-token 端点; tokenField 归位 mineru_token, 与后端契约一致。
          $provPath = "frontend/src/js/config/providers.ts"
          $prov = Get-Content $provPath -Raw -Encoding utf8
          if ($prov.Contains("LingoMaster")) { throw "patch marker already present in $provPath" }
          $anchor6a = 'export const DEFAULT_OCR_PROVIDER = "paddle";'
          if ([regex]::Matches($prov, [regex]::Escape($anchor6a)).Count -ne 1) { throw "anchor6a missing/dup in $provPath" }
          $prov = $prov.Replace($anchor6a, 'export const DEFAULT_OCR_PROVIDER = "mineru";')
          $anchor6b = 'export const OCR_PROVIDER_DEFINITIONS = ['
          if ([regex]::Matches($prov, [regex]::Escape($anchor6b)).Count -ne 1) { throw "anchor6b missing/dup in $provPath" }
          $mineru = @'
          export const OCR_PROVIDER_DEFINITIONS = [
            {
              id: "mineru",
              label: "MinerU",
              description: "MinerU 文档解析（LingoMaster 托管）。",
              tokenField: "mineru_token",
              runtimeConfigKey: "mineruToken",
              tokenLabel: "MinerU Token",
              tokenPlaceholder: "MinerU Token",
              validationButtonLabel: "检测 MinerU",
              validationIdleMessage: "未检测",
              validationMissingMessage: "请先登录 LingoMaster。",
              validationUnavailableMessage: "",
              docsUrl: "",
              docsLabel: "",
              supportsValidation: false,
            },
          '@
          $prov = $prov.Replace($anchor6b, $mineru.Trim())
          Set-Content -Path $provPath -Value $prov -Encoding utf8 -NoNewline
          Write-Host "providers.ts patched (MinerU provider restored, default -> mineru)"

          # --- 补丁7 (lm8, plan R11b): 主进程也有一份硬编码白名单 ---
          # desktop/src/main/desktop-config.js:
          #   function normalizeOcrProvider(value) {
