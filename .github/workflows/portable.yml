                      counts["hangul"] += 1
                      counts["total_letters"] += 1
                  elif (0x0041 <= code <= 0x005A) or (0x0061 <= code <= 0x007A) \
                          or (0x00C0 <= code <= 0x024F) or (0x1E00 <= code <= 0x1EFF):
                      counts["latin"] += 1
                      counts["total_letters"] += 1
                  elif 0x0400 <= code <= 0x04FF:
                      counts["cyrillic"] += 1
                      counts["total_letters"] += 1
                  elif 0x0600 <= code <= 0x06FF:
                      counts["arabic"] += 1
                      counts["total_letters"] += 1
                  elif 0x0E00 <= code <= 0x0E7F:
                      counts["thai"] += 1
                      counts["total_letters"] += 1
              return counts


          def _dominant(counts: dict, key: str, ratio: float = 0.6) -> bool:
              total = counts["total_letters"]
              return total >= 40 and counts[key] >= total * ratio


          def _latin_language_matches(text: str, expected: str) -> bool:
              """文本呈现 expected 语种的功能词指纹, 且明显强于其它拉丁语种."""
              words = re.findall(r"[a-zA-ZÀ-ÿĀ-ſḀ-ỿ]+", text.lower())
              if len(words) < 30:
                  return False
              scores = {
                  lang: sum(1 for w in words if w in stopset)
                  for lang, stopset in _LATIN_STOPWORDS.items()
              }
              expected_score = scores.get(expected, 0)
              if expected_score < max(5, len(words) * 0.02):
                  return False
              best_other = max((s for l, s in scores.items() if l != expected), default=0)
              return expected_score > best_other * 1.5


          def collect_sample_text(data: dict, start: int, stop: int,
                                  max_blocks: int = 80, max_chars: int = 6000) -> str:
              """从已选页范围抽正文样本(与翻译同源的 extract_text_items, 扫描版同样有效)."""
              from services.translation.core.ocr.json_extractor import extract_text_items

              parts: list[str] = []
              total = 0
              for page_idx in range(start, stop + 1):
                  try:
                      items = extract_text_items(data, page_idx=page_idx)
                  except Exception:
                      continue
                  for item in items:
                      text = (getattr(item, "text", "") or "").strip()
                      if not text:
                          continue
                      parts.append(text)
                      total += len(text)
                      if len(parts) >= max_blocks or total >= max_chars:
                          return "\n".join(parts)
              return "\n".join(parts)


          def detect_conflict(sample_text: str, target_lang: str, target_language_name: str) -> str:
              """判定"文档已是目标语种"则返回用户可读描述, 否则空串(放行)."""
              text = (sample_text or "").strip()
              if not text:
                  return ""
              counts = _script_counts(text)
              code = (target_lang or "").strip()
              primary = code.lower().replace("_", "-").split("-")[0]

              if primary == "zh":
                  if not _dominant(counts, "han") or counts["kana"] > counts["total_letters"] * 0.05:
                      return ""
                  simp, trad = counts["simp"], counts["trad"]
                  is_tw = code.lower() in ("zh-tw", "zh-hant", "zh-hk", "zh-mo")
                  if simp + trad >= 5:
                      doc_is_trad = trad > simp * 2
                      doc_is_simp = simp > trad * 2
                      if is_tw and not doc_is_trad:
                          return ""
                      if (not is_tw) and not doc_is_simp:
                          return ""
                  return "文档正文已是中文"
              if primary == "ja":
                  if counts["kana"] >= max(20, counts["total_letters"] * 0.1):
                      return "文档正文已是日文"
                  return ""
              if primary == "ko":
                  return "文档正文已是韩文" if _dominant(counts, "hangul") else ""
              if primary == "ru":
                  return "文档正文已是俄文" if _dominant(counts, "cyrillic") else ""
              if primary == "ar":
                  return "文档正文已是阿拉伯文" if _dominant(counts, "arabic") else ""
              if primary == "th":
                  return "文档正文已是泰文" if _dominant(counts, "thai") else ""
              if primary in _LATIN_STOPWORDS and _dominant(counts, "latin"):
                  if _latin_language_matches(text, primary):
                      display = (target_language_name or code).strip()
                      return f"文档正文已是目标语言({display})"
              return ""


          def ensure_target_language_differs(sample_text: str, target_lang: str,
                                             target_language_name: str) -> None:
              verdict = detect_conflict(sample_text, target_lang, target_language_name)
              if verdict:
                  display = (target_language_name or target_lang or "").strip()
                  raise SameLanguageError(
                      f"{verdict}, 与目标翻译语言({display})相同, 已在调用翻译模型前停止, "
                      "本次不产生模型费用。请在 RetainPDF 的 设置 → 任务选项 → 目标语言 "
                      "里换一种语言后重新提交。"
                  )
          '@
          Set-Content -Path $guardPath -Value $guardPy -Encoding utf8 -NoNewline
          Write-Host "created $guardPath"

          # 9b: execution_plan 接线(两处单行锚)
          $planPath = "backend/scripts/services/translation/workflow/execution_plan.py"
          $plan = Get-Content $planPath -Raw -Encoding utf8
          if ($plan.Contains("lm_language_guard")) { throw "patch marker already present in $planPath" }
          $anchor9b1 = "from services.translation.workflow.page_range import resolve_page_range"
          if ([regex]::Matches($plan, [regex]::Escape($anchor9b1)).Count -ne 1) { throw "anchor9b1 missing/dup in $planPath" }
          $imports9 = $anchor9b1 + "`n" + "from services.translation.workflow.lm_language_guard import collect_sample_text as _lm_collect_sample_text  # [lingomaster] R12" + "`n" + "from services.translation.workflow.lm_language_guard import ensure_target_language_differs as _lm_ensure_target_differs" + "`n" + "from services.translation.services.context.session_context import _lm_resolve_target_language"
          $plan = $plan.Replace($anchor9b1, $imports9)
          $anchor9b2 = "    start, stop = resolve_page_range(page_count, request.start_page, request.end_page)"
          if ([regex]::Matches($plan, [regex]::Escape($anchor9b2)).Count -ne 1) { throw "anchor9b2 missing/dup in $planPath" }
          $guardCall = @'
              start, stop = resolve_page_range(page_count, request.start_page, request.end_page)

              # [lingomaster] R12: 源=目标语种在任何 LLM 调用(含 sci domain 推断)之前
              # 拦截; 判别保守, 不确定一律放行, 详见 lm_language_guard.py。
              _lm_lang, _lm_name = _lm_resolve_target_language()
              _lm_ensure_target_differs(
                  _lm_collect_sample_text(data, start, stop),
                  _lm_lang,
                  _lm_name,
              )
          '@
          $plan = $plan.Replace($anchor9b2, $guardCall.TrimEnd())
          Set-Content -Path $planPath -Value $plan -Encoding utf8 -NoNewline
          Write-Host "execution_plan.py patched (same-language guard wired)"

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python runtime for desktop bundle
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Verify generated Python requirement snapshots
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: python backend/scripts/devtools/sync_python_requirements.py --repo-root . --check

      - name: Setup Rust toolchain
        if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust API for Windows
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path backend/rust_api/Cargo.toml

      - name: Assemble bundled Typst runtime
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $typstVersion = "${{ env.TYPST_VERSION }}"
          $typstUrl = "https://github.com/typst/typst/releases/download/v$typstVersion/typst-x86_64-pc-windows-msvc.zip"
          $downloadZip = Join-Path $env:RUNNER_TEMP "typst-windows.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP "typst-windows"
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/windows/typst"
          Invoke-WebRequest -Uri $typstUrl -OutFile $downloadZip
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -Path $downloadZip -DestinationPath $extractRoot -Force
          if (Test-Path $bundleRoot) { Remove-Item $bundleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot "bin") -Force | Out-Null
          $typstExe = Get-ChildItem -Path $extractRoot -Recurse -Filter "typst.exe" | Select-Object -First 1
          if (-not $typstExe) { throw "typst.exe not found in downloaded archive" }
          Copy-Item $typstExe.FullName (Join-Path $bundleRoot "bin/typst.exe") -Force

      - name: Assemble bundled Typst packages
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/shared/typst-packages/preview"
          $packages = @(
            @{ Name = "cmarker"; Version = "${{ env.CMARKER_VERSION }}" },
            @{ Name = "mitex"; Version = "${{ env.MITEX_VERSION }}" }
          )
          if (Test-Path (Join-Path $PWD "desktop/src/runtime/shared/typst-packages")) {
            Remove-Item (Join-Path $PWD "desktop/src/runtime/shared/typst-packages") -Recurse -Force
          }
          foreach ($pkg in $packages) {
            $url = "https://packages.typst.org/preview/$($pkg.Name)-$($pkg.Version).tar.gz"
            $download = Join-Path $env:RUNNER_TEMP "$($pkg.Name)-$($pkg.Version).tar.gz"
            $extractRoot = Join-Path $env:RUNNER_TEMP "$($pkg.Name)-$($pkg.Version)"
            $targetDir = Join-Path $bundleRoot "$($pkg.Name)/$($pkg.Version)"
            Invoke-WebRequest -Uri $url -OutFile $download
            if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
            tar -xzf $download -C $extractRoot
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Copy-Item (Join-Path $extractRoot "*") $targetDir -Recurse -Force
          }

      - name: Assemble bundled Python runtime
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $pythonRoot = Split-Path -Parent $pythonExe
          $bundleRoot = Join-Path $PWD "desktop/src/runtime/windows/python"
          if (Test-Path $bundleRoot) { Remove-Item $bundleRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $bundleRoot | Out-Null
          robocopy $pythonRoot $bundleRoot /E /NFL /NDL /NJH /NJS /NP /XD "__pycache__" "Doc" "docs" "Tools"
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          $sitePackages = Join-Path $bundleRoot "Lib/site-packages"
          if (Test-Path $sitePackages) { Remove-Item $sitePackages -Recurse -Force }
          New-Item -ItemType Directory -Path $sitePackages -Force | Out-Null
          python -m pip install --upgrade pip
          python -m pip install --target $sitePackages -r desktop/requirements-desktop-windows.txt
          python -m pip install --target $sitePackages -r desktop/requirements-ai-service.txt
          $pythonBundleExe = Join-Path $bundleRoot "python.exe"
          $env:PYTHONPATH = $sitePackages
          & $pythonBundleExe -c "import requests, fitz, pikepdf, PIL, urllib3; print('python_bundle_import_check=ok')"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue

      - name: Install desktop dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Install frontend dependencies
        if: steps.version.outputs.skip != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          node -e "require('@tailwindcss/oxide')"
          if ($LASTEXITCODE -ne 0) {
            $ver = node -p "require('./node_modules/@tailwindcss/oxide/package.json').version"
            npm install --no-save --no-package-lock "@tailwindcss/oxide@$ver"
            node -e "require('@tailwindcss/oxide')"
            if ($LASTEXITCODE -ne 0) { throw "tailwindcss oxide native binding missing after reinstall" }
          }

      - name: Build Windows app directory (win-unpacked)
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        shell: pwsh
        env:
          RETAIN_PDF_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # R6 (2026-08-02): 弃 portable 自解压单 exe (上游 dist:win32), 改出目录形态 —
          # portable 每次启动都要向临时目录解包 190MB (分钟级盲等), 目录形态启动秒开。
          # prepare-app 与上游 dist:win32 前半段一致; --win dir 覆盖 package.json 的 portable target。
          npm run prepare-app
          if ($LASTEXITCODE -ne 0) { throw "prepare-app failed" }
          npx electron-builder --win dir --x64 --config.directories.output=win
          if ($LASTEXITCODE -ne 0) { throw "electron-builder --win dir failed" }

      - name: Validate desktop bundle manifest
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          Get-Content desktop/app/backend/bundle-manifest.json -Encoding utf8
          npm --prefix desktop run smoke:frontend-bundle
          python .github/scripts/validate_desktop_bundle.py --manifest desktop/app/backend/bundle-manifest.json

      - name: Verify patch survived into built bundle
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.suffix != ''
        shell: pwsh
        run: |
          # esbuild minify 会剥注释/重命名标识符, 用补丁里的 console.error 字符串字面量作探针;
          # 全树搜产物 (frontend/dist 与 desktop/app 各有一份), 每份都必须含探针
          # 本步所有 Get-Content 必须显式 -Encoding utf8: 探针里有中文字面量, 缺了这个参数
          # 在 Windows PowerShell 5.1 下会按 ANSI(本机 cp1252) 读成乱码 —— 正向探针假失败,
          # 反向探针(457 行)假通过。CI 是 pwsh 7 默认 UTF-8 看不出来, 本地复现才炸。
          $bundles = Get-ChildItem -Path . -Filter "app.bundle.js" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $bundles) { throw "no app.bundle.js found for patch verification" }
          foreach ($b in $bundles) {
            $text = Get-Content $b.FullName -Raw -Encoding utf8
            if (-not $text.Contains("[lingomaster] desktop config bootstrap failed")) {
              throw "bootstrap patch probe missing in built bundle: $($b.FullName)"
            }
            if (-not $text.Contains("bk111/retain-pdf")) {
              throw "update-redirect probe (GITHUB_REPO=bk111/retain-pdf) missing in: $($b.FullName)"
            }
            # 反向探针(补丁4b): 那句拦死提交的红字必须从产物里彻底消失。
            # esbuild 默认把非 ASCII 输出成 \uXXXX 转义 —— 只查中文字面量是
            # **空转假通过**(lm9 首轮构建实证: 正向中文探针找不到才暴露),
            # 必须连转义形态一起查。
            $gateEscaped = -join ("无法确认 DeepSeek 余额".ToCharArray() | ForEach-Object { $c = [int]$_; if ($c -gt 127) { '\u{0:x4}' -f $c } else { [string]$_ } })
            if ($text.Contains("无法确认 DeepSeek 余额") -or $text.ToLowerInvariant().Contains($gateEscaped.ToLowerInvariant())) {
              throw "balance-unknown gate still present in: $($b.FullName)"
            }
            # 补丁6: MinerU 供应商定义必须在册(否则 provider 又被回落成 paddle)
            if (-not $text.Contains("LingoMaster")) {
              throw "MinerU provider definition missing in: $($b.FullName)"
            }
            # 补丁8: 目标语种选择器(DOM id 字面量 + 语种表条目)。探针必须用
            # 纯 ASCII 串 —— esbuild 把非 ASCII 转义成 \uXXXX, 中文字面量在
            # bundle 里根本找不到(lm9 首轮构建以"繁體中文"作探针即因此失败)。
            if (-not $text.Contains("browser-target-language")) {
              throw "target-language selector probe (dom id) missing in: $($b.FullName)"
            }
            if (-not $text.Contains("Bahasa Indonesia")) {
              throw "target-language table probe missing in: $($b.FullName)"
            }
            Write-Host "frontend patch probes OK (bootstrap + update-redirect + balance gate removed + lang selector) in $($b.FullName)"
          }
          # 补丁10 探针: 聚合断言, 不逐 bundle 要求正向标记 —— resolveTranslated
          # PdfDownloadName 只被 home/reader 消费, detail 页不引用, esbuild 会把
          # 它整段 tree-shake 掉 (lm10 首轮构建实证: detail.bundle.js 正向探针
          # 假失败, 而同一份的反向探针通过 = 那份根本没有这段代码)。
          # 正向: 至少一份产物含标记(补丁确实进了船); 反向: 所有产物都不得残留
          # 写死的 `zh_${` 模板(硬编码彻底消失)。
          $allBundles = Get-ChildItem -Path . -Filter "*.bundle.js" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $allBundles) { throw "no *.bundle.js found for lm10 probe" }
          $lm10Hits = @()
          foreach ($bc in $allBundles) {
            $bt = Get-Content $bc.FullName -Raw -Encoding utf8
            if ($bt.Contains("lm10-prefix-by-target-language")) { $lm10Hits += $bc.FullName }
            if ($bt.Contains('zh_${')) {
              throw "hard-coded zh_ template still present in: $($bc.FullName)"
            }
          }
          if (-not $lm10Hits) { throw "lm10 prefix probe missing in every bundle" }
          Write-Host "lm10 prefix probes OK (marker in $($lm10Hits.Count)/$($allBundles.Count) bundles, no hard-coded zh_ anywhere)"
          $lm10Hits | ForEach-Object { Write-Host "  marker: $_" }
          # 补丁3 探针: 打包进 app 的后端 python 必含 env 回退 + desktop-config 读取
          $ctxCopies = Get-ChildItem -Path . -Filter "session_context.py" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $ctxCopies) { throw "no session_context.py found for patch verification" }
          foreach ($c in $ctxCopies) {
            $ctxText = Get-Content $c.FullName -Raw -Encoding utf8
            if (-not $ctxText.Contains("RETAIN_TARGET_LANGUAGE_NAME")) {
              throw "target-language env probe missing in: $($c.FullName)"
            }
            if (-not $ctxText.Contains("targetLanguageName")) {
              throw "target-language desktop-config probe (lm9 call-time resolution) missing in: $($c.FullName)"
            }
            Write-Host "target-language probes found in $($c.FullName)"
          }
          # 补丁9 探针: 同语种守卫文件在船上, 且 execution_plan 完成接线
          $guardCopies = Get-ChildItem -Path . -Filter "lm_language_guard.py" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $guardCopies) { throw "no lm_language_guard.py found for patch verification" }
          $guardCopies | ForEach-Object { Write-Host "language guard present: $($_.FullName)" }
          $planCopies = Get-ChildItem -Path . -Filter "execution_plan.py" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $planCopies) { throw "no execution_plan.py found for patch verification" }
          foreach ($pc in $planCopies) {
            if (-not (Get-Content $pc.FullName -Raw -Encoding utf8).Contains("lm_language_guard")) {
              throw "same-language guard wiring missing in: $($pc.FullName)"
            }
            Write-Host "guard wiring found in $($pc.FullName)"
          }
          # 补丁7 探针: 主进程的 provider 白名单(asar 内主进程代码不压缩, 标记可直查)
          $mains = Get-ChildItem -Path . -Filter "desktop-config.js" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $mains) { throw "no desktop-config.js found for patch verification" }
          foreach ($m in $mains) {
            $mt = Get-Content $m.FullName -Raw -Encoding utf8
            if (-not $mt.Contains("[lingomaster] main-process OCR provider whitelist")) {
              throw "main-process provider whitelist patch missing in: $($m.FullName)"
            }
            if (-not $mt.Contains('value === "mineru"')) {
              throw "main-process whitelist does not accept mineru in: $($m.FullName)"
            }
            Write-Host "main-process provider probe OK in $($m.FullName)"
          }
          # 补丁5 探针: 装船的 prompt 必含同语种守卫
          $prompts = Get-ChildItem -Path . -Filter "translation_system.txt" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "node_modules" }
          if (-not $prompts) { throw "no translation_system.txt found for patch verification" }
          foreach ($p in $prompts) {
            if (-not (Get-Content $p.FullName -Raw -Encoding utf8).Contains("请原样逐字输出原文")) {
              throw "same-language guard missing in: $($p.FullName)"
            }
            Write-Host "same-language guard found in $($p.FullName)"
          }

      - name: Package app-directory zip (with upstream LICENSE)
        if: steps.version.outputs.skip != 'true'
        id: package
        shell: pwsh
        run: |
          $releaseVersion = "${{ steps.version.outputs.release_version }}"
          $unpacked = "desktop/win/win-unpacked"
          # 稳定入口名: 客户端 tool_manager 的 bin_name 是静态契约 (lm2 起 = RetainPDF.exe)
          if (-not (Test-Path "$unpacked/RetainPDF.exe")) { Get-ChildItem desktop/win | Select-Object Name; throw "RetainPDF.exe not found in $unpacked" }
          Copy-Item LICENSE (Join-Path $unpacked "LICENSE-RetainPDF.txt") -ErrorAction SilentlyContinue
          # 长路径预算: 客户端解压到 <app>\bin\retain-pdf\, 用户机未必开 LongPathsEnabled;
          # zip 内相对路径超 180 字符即失败, 留 ~80 字符给安装前缀
          $rootLen = (Resolve-Path $unpacked).Path.Length + 1
          $paths = Get-ChildItem $unpacked -Recurse -File | ForEach-Object { $_.FullName.Substring($rootLen) }
          $longest = $paths | Sort-Object Length -Descending | Select-Object -First 5
          Write-Host "longest relative paths:"
          $longest | ForEach-Object { Write-Host ("  {0} chars: {1}" -f $_.Length, $_) }
          if (($longest | Select-Object -First 1).Length -gt 180) { throw "zip relative path exceeds 180 chars budget" }
          $zip = "RetainPDF-v$releaseVersion-portable-win-x64.zip"
          Compress-Archive -Path "$unpacked/*" -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "asset=$zip sha256=$sha size=$([math]::Round((Get-Item $zip).Length/1MB,1))MB"

      - name: Publish to fork release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: "RetainPDF ${{ steps.version.outputs.release_tag }} portable (unofficial build)"
